name: Scheduled Repo Onboarding (scan)

# Zero-touch onboarding: loopt periodiek de org af en seedt elke repo met
# '%gitoqlok_repo%' in de beschrijving die nog niet is geseed. Idempotent.
# Handmatig starten kan via 'Run workflow'.

on:
  schedule:
    - cron: "17 6 * * *"    # dagelijks; vangnet voor nieuwe repo's
  push:
    branches: [main]
    paths: ["templates/**", ".github/scripts/init_repo.py"]   # conventies direct uitrollen
  workflow_dispatch:
    inputs:
      target_orgs:
        description: "Komma-gescheiden org(s) om te scannen (leeg = repo-variabele/eigen org)"
        required: false
        type: string

jobs:
  scan-and-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Scan org(s) and seed Qlik repos
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          # Te scannen org(s): handmatige input > repo-variabele > eigen org.
          TARGET_ORGS: ${{ inputs.target_orgs || vars.TARGET_ORGS || github.repository_owner }}
          # Waar de reusable workflows staan (deze automation-repo).
          AUTOMATION_ORG: ${{ vars.AUTOMATION_ORG || github.repository_owner }}
          # REPO_NAME bewust leeg → scan-modus
        run: python .github/scripts/init_repo.py
